<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flotte Helfer - Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0B6E4F;
      --primary-dark: #084D38;
      --accent: #E8871E;
      --secondary: #1A8A8A;
      --dark: #0F1923;
      --dark-2: #1a2736;
      --dark-3: #2a3a4a;
      --gold: #F5C518;
      --light: #F7F9FC;
      --white: #ffffff;
      --border: rgba(255,255,255,0.08);
      --text: #94a3b8;
      --radius: 16px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-heading: 'Oswald', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ========== LOGIN ========== */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 100%);
    }

    .login-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .login-logo .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: var(--white);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 12px;
    }

    .login-logo .logo-text {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .login-card h2 {
      font-family: var(--font-heading);
      color: var(--white);
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 24px;
    }

    .login-form input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: all var(--transition);
      margin-bottom: 16px;
    }

    .login-form input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11, 110, 79, 0.2);
    }

    .login-form input::placeholder { color: rgba(255,255,255,0.3); }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: var(--white);
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .login-btn:hover { background: #c97218; transform: translateY(-2px); }

    .login-error {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* ========== DASHBOARD ========== */
    .dashboard { display: none; min-height: 100vh; }
    .dashboard.active { display: flex; }

    .sidebar {
      width: 260px;
      background: var(--dark-2);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .sidebar-logo .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: var(--white);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .sidebar-logo .logo-text {
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all var(--transition);
      border-left: 3px solid transparent;
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      background: rgba(11, 110, 79, 0.1);
      color: var(--white);
      border-left-color: var(--primary);
    }

    .sidebar-nav svg { flex-shrink: 0; }

    .sidebar-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    .sidebar-bottom a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color var(--transition);
    }

    .sidebar-bottom a:hover { color: #ef4444; }

    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .dash-header h1 {
      font-family: var(--font-heading);
      color: var(--white);
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dash-header-actions { display: flex; gap: 12px; }

    .dash-btn {
      padding: 10px 20px;
      border-radius: 50px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
    }

    .dash-btn-primary {
      background: var(--accent);
      color: var(--white);
    }

    .dash-btn-primary:hover { background: #c97218; }

    .dash-btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .dash-btn-outline:hover { border-color: rgba(255,255,255,0.2); color: var(--white); }

    /* Stats Cards */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .stat-card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .stat-card-value {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
    }

    .stat-card-change {
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .stat-card-change.positive { color: #22c55e; }
    .stat-card-change.neutral { color: var(--accent); }

    /* Table */
    .table-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .table-header h3 {
      font-family: var(--font-heading);
      color: var(--white);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .table-filter {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all var(--transition);
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 14px 24px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 16px 24px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
      color: rgba(255,255,255,0.8);
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-neu { background: rgba(232, 135, 30, 0.15); color: var(--accent); }
    .badge-kontaktiert { background: rgba(26, 138, 138, 0.15); color: var(--secondary); }
    .badge-erledigt { background: rgba(11, 110, 79, 0.15); color: var(--primary); }

    .action-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all var(--transition);
      font-size: 0.8rem;
    }

    .action-btn:hover { background: rgba(255,255,255,0.06); color: var(--white); }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text);
    }

    .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 0.95rem; }

    /* Responsive */
    @media (max-width: 1024px) {
      .stats-cards { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
      .stats-cards { grid-template-columns: 1fr; }
      .dash-header { flex-direction: column; gap: 16px; align-items: flex-start; }
      .table-card { overflow-x: auto; }
      table { min-width: 600px; }
    }
  </style>
</head>
<body>

  <!-- ========== LOGIN SCREEN ========== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">FH</span>
        <span class="logo-text">Flotte Helfer</span>
      </div>
      <h2>Admin Dashboard</h2>
      <form class="login-form" onsubmit="handleLogin(event)">
        <input type="text" id="loginUser" placeholder="Benutzername" autocomplete="username" required>
        <input type="password" id="loginPass" placeholder="Passwort" autocomplete="current-password" required>
        <button type="submit" class="login-btn">Anmelden</button>
        <p class="login-error" id="loginError">Ungueltige Zugangsdaten</p>
      </form>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div class="dashboard" id="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">FH</span>
        <span class="logo-text">Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Anfragen
        </a>
        <a href="../index.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Website ansehen
        </a>
      </nav>
      <div class="sidebar-bottom">
        <a href="#" onclick="handleLogout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Abmelden
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <div class="dash-header">
        <h1>Dashboard</h1>
        <div class="dash-header-actions">
          <button class="dash-btn dash-btn-outline" onclick="exportCSV()">CSV Export</button>
          <button class="dash-btn dash-btn-primary" onclick="clearSubmissions()">Alle loeschen</button>
        </div>
      </div>

      <div class="stats-cards" id="statsCards">
        <!-- Filled by JS -->
      </div>

      <div class="table-card">
        <div class="table-header">
          <h3>Anfragen</h3>
          <div class="table-filter">
            <button class="filter-btn active" onclick="filterTable('all', this)">Alle</button>
            <button class="filter-btn" onclick="filterTable('Neu', this)">Neu</button>
            <button class="filter-btn" onclick="filterTable('Kontaktiert', this)">Kontaktiert</button>
            <button class="filter-btn" onclick="filterTable('Erledigt', this)">Erledigt</button>
          </div>
        </div>
        <div id="tableContainer">
          <!-- Filled by JS -->
        </div>
      </div>
    </main>
  </div>

  <script>
    // ========== AUTH ==========
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = '***REMOVED***';

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('fh_admin', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('fh_admin');
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      renderDashboard();
    }

    // Check session
    if (sessionStorage.getItem('fh_admin') === 'true') {
      showDashboard();
    }

    // ========== DASHBOARD DATA ==========
    let currentFilter = 'all';

    function getSubmissions() {
      return JSON.parse(localStorage.getItem('fh_submissions') || '[]');
    }

    function renderDashboard() {
      const submissions = getSubmissions();
      renderStats(submissions);
      renderTable(submissions);
    }

    function renderStats(submissions) {
      const total = submissions.length;
      const neu = submissions.filter(s => s.status === 'Neu').length;
      const kontaktiert = submissions.filter(s => s.status === 'Kontaktiert').length;
      const erledigt = submissions.filter(s => s.status === 'Erledigt').length;

      document.getElementById('statsCards').innerHTML = `
        <div class="stat-card">
          <div class="stat-card-label">Gesamt Anfragen</div>
          <div class="stat-card-value">${total}</div>
          <div class="stat-card-change neutral">Alle Anfragen</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Neue Anfragen</div>
          <div class="stat-card-value">${neu}</div>
          <div class="stat-card-change" style="color: var(--accent);">Noch unbearbeitet</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Kontaktiert</div>
          <div class="stat-card-value">${kontaktiert}</div>
          <div class="stat-card-change" style="color: var(--secondary);">In Bearbeitung</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Erledigt</div>
          <div class="stat-card-value">${erledigt}</div>
          <div class="stat-card-change positive">Abgeschlossen</div>
        </div>
      `;
    }

    function renderTable(submissions) {
      const filtered = currentFilter === 'all'
        ? submissions
        : submissions.filter(s => s.status === currentFilter);

      if (filtered.length === 0) {
        document.getElementById('tableContainer').innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <p>Keine Anfragen vorhanden</p>
          </div>
        `;
        return;
      }

      const rows = filtered.map(sub => {
        const d = sub.data;
        const date = new Date(sub.timestamp).toLocaleDateString('de-DE', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        const badgeClass = sub.status === 'Neu' ? 'badge-neu' : sub.status === 'Kontaktiert' ? 'badge-kontaktiert' : 'badge-erledigt';

        return `
          <tr>
            <td>${date}</td>
            <td>${d.name || '-'}</td>
            <td>${d.email || '-'}</td>
            <td>${d.telefon || '-'}</td>
            <td>${d.leistung || '-'}</td>
            <td><span class="badge ${badgeClass}">${sub.status}</span></td>
            <td>
              <button class="action-btn" onclick="cycleStatus('${sub.id}')" title="Status aendern">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
              </button>
              <button class="action-btn" onclick="deleteSubmission('${sub.id}')" title="Loeschen">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('tableContainer').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Name</th>
              <th>E-Mail</th>
              <th>Telefon</th>
              <th>Leistung</th>
              <th>Status</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function cycleStatus(id) {
      const submissions = getSubmissions();
      const sub = submissions.find(s => s.id === id);
      if (!sub) return;

      const cycle = { 'Neu': 'Kontaktiert', 'Kontaktiert': 'Erledigt', 'Erledigt': 'Neu' };
      sub.status = cycle[sub.status] || 'Neu';

      localStorage.setItem('fh_submissions', JSON.stringify(submissions));
      renderDashboard();
    }

    function deleteSubmission(id) {
      const submissions = getSubmissions().filter(s => s.id !== id);
      localStorage.setItem('fh_submissions', JSON.stringify(submissions));
      renderDashboard();
    }

    function clearSubmissions() {
      if (confirm('Alle Anfragen wirklich loeschen?')) {
        localStorage.setItem('fh_submissions', '[]');
        renderDashboard();
      }
    }

    function filterTable(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTable(getSubmissions());
    }

    function exportCSV() {
      const submissions = getSubmissions();
      if (!submissions.length) return alert('Keine Daten vorhanden.');

      const headers = ['Datum', 'Name', 'E-Mail', 'Telefon', 'Leistung', 'Nachricht', 'Status'];
      const rows = submissions.map(s => [
        new Date(s.timestamp).toLocaleDateString('de-DE'),
        s.data.name || '',
        s.data.email || '',
        s.data.telefon || '',
        s.data.leistung || '',
        (s.data.nachricht || '').replace(/"/g, '""'),
        s.status
      ]);

      let csv = headers.join(';') + '\n';
      rows.forEach(row => {
        csv += row.map(v => `"${v}"`).join(';') + '\n';
      });

      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `flotte-helfer-anfragen-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
